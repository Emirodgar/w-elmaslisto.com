    <style>
        /* El padding: 15px del body crea el espacio lateral que necesitas */
        body { background-color: #78c8ff; }

        /* --- CAMBIO AQUÍ: Añadimos estilos para el .wrapper --- */
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px; /* El max-width se mueve aquí */
        }

        /* --- CAMBIO AQUÍ: El game-container ahora solo ocupa el 100% de su padre (el wrapper) --- */
        .game-container { 
            width: 100%; 
            background: #fff; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 8px 0 #4a90e2; 
            text-align: center; 
            box-sizing: border-box;
        }

        #main-image { 
            max-width: 70%; 
            height: auto; 
            margin: 20px 0; 
            border-radius: 15px; 
            border: 5px solid #eee; 
        }
        .options { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-top: 20px; 
        }
        .option-btn { 
            padding: 20px; 
            font-size: 1.5em; 
            font-weight: bold; 
            border: 2px solid #ddd; 
            background-color: #f9f9f9; 
            border-radius: 15px; 
            cursor: pointer; 
            box-shadow: 0 4px 0 #ddd; 
            transition: all 0.1s; 
        }
        .option-btn:active { 
            transform: translateY(4px); 
            box-shadow: 0 0 0 #ddd; 
        }
        .correct { 
            background-color: #d7ffb8; 
            border-color: #8ac926; 
            box-shadow: 0 4px 0 #8ac926; 
        }
        .incorrect { 
            background-color: #ffdfe0; 
            border-color: #ff5c5c; 
            box-shadow: 0 4px 0 #ff5c5c; 
        }
		
        
        
        
    </style>
</head>
<body>

    <!-- El wrapper ya estaba, pero ahora el CSS lo utilizará correctamente -->
    <div class="wrapper">

"Bus", "Train"] },{ word: "Cup", image: "img/vocab/cup.png", options: ["Cup", "Glass"] },{ word: "Hat", image: "img/vocab/hat.svg", options: ["Hat", "Cap"] },{ word: "Phone", image: "img/vocab/phone.png", options: ["Phone", "Tablet"] },{ word: "Shoe", image: "img/vocab/shoe.svg", options: ["Shoe", "Boot"] },{ word: "Socks", image: "img/vocab/socks.png", options: ["Socks", "Gloves"] },{ word: "Train", image: "img/vocab/train.png", options: ["Train", "Plane"] },{ word: "Pencil", image: "img/vocab/pencil.png", options: ["Pencil", "Pen"] },{ word: "School", image: "img/vocab/school.png", options: ["School", "Hospital"] },{ word: "Shop", image: "img/vocab/shop.png", options: ["Shop", "Bank"] },{ word: "TV", image: "img/vocab/tv.png", options: ["TV", "Radio"] },{ word: "Window", image: "img/vocab/window.svg", options: ["Window", "Mirror"] },{ word: "Eye", image: "img/vocab/eye.svg", options: ["Eye", "Ear"] },{ word: "Hand", image: "img/vocab/hand.svg", options: ["Hand", "Arm"] },{ word: "Foot", image: "img/vocab/foot.svg", options: ["Foot", "Leg"] },{ word: "Nose", image: "img/vocab/nose.svg", options: ["Nose", "Mouth"] },{ word: "Hair", image: "img/vocab/long-hair.svg", options: ["Hair", "Head"] },{ word: "Shirt", image: "img/vocab/shirt.png", options: ["Shirt", "Jacket"] },{ word: "Pants", image: "img/vocab/jeans.png", options: ["Pants", "Shorts"] },{ word: "Dress", image: "img/vocab/dress.svg", options: ["Dress", "Skirt"] },{ word: "Ring", image: "img/vocab/ring.svg", options: ["Ring", "Watch"] },{ word: "Coat", image: "img/vocab/coat.png", options: ["Coat", "Scarf"] }
        ];
        let currentItem;
        const imageEl = document.getElementById('main-image' );
        const optionsEl = document.getElementById('options');

        function nextRound() {
            currentItem = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            imageEl.style.visibility = 'visible';
            imageEl.src = currentItem.image;
            optionsEl.innerHTML = '';
            
            const shuffledOptions = [...currentItem.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(opt => {
                const button = document.createElement('button');
                button.textContent = opt;
                button.classList.add('option-btn');
                button.onclick = () => checkAnswer(opt, button);
                optionsEl.appendChild(button);
            });
        }

        function checkAnswer(selectedWord, button) {
            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            if (selectedWord === currentItem.word) {
                button.classList.add('correct');
                setTimeout(nextRound, 1500);
            } else {
                button.classList.add('incorrect');
                setTimeout(() => {
                    document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = false);
                    button.classList.remove('incorrect');
                }, 1500);
            }
        }
        nextRound();
    </script>
