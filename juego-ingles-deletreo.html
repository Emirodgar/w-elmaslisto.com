<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construye la Palabra: Deletrear en Inglés | El Más Listo</title>
    <meta name="description" content="Aprende inglés deletreando palabras a partir de imágenes. Juego educativo gratuito para niños.">
    <link rel="canonical" href="https://elmaslisto.com/juego-ingles-deletreo">
    <meta property="og:title" content="Construye la Palabra: Deletrear en Inglés">
    <meta property="og:description" content="Aprende inglés deletreando palabras a partir de imágenes. Juego educativo gratuito para niños.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://elmaslisto.com/juego-ingles-deletreo">
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* El padding: 15px del body ya crea el espacio lateral que necesitas */
        body { background-color: #ffc02e; }
        
        /* --- CAMBIO AQUÍ: Añadimos estilos para el .wrapper --- */
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px; /* El max-width se mueve aquí */
        }

        /* --- CAMBIO AQUÍ: El game-container ahora solo ocupa el 100% de su padre (el wrapper) --- */
        .game-container { 
            width: 100%; 
            background: #fff; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 8px 0 #e5a91a; 
            text-align: center;
            box-sizing: border-box;
        }

        #main-image { max-width: 50%; height: auto; margin-bottom: 20px; }
        .slots, .letters { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .slot, .letter { width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; font-size: 1.8em; font-weight: bold; border-radius: 10px; user-select: none; }
        .slot { background-color: #eee; border: 2px dashed #ccc; }
        .letter { background-color: #78c8ff; color: white; cursor: pointer; box-shadow: 0 4px 0 #4a90e2; }
        .correct-animation { animation: bounce 0.5s; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        
        
        
        
        
    </style>
</head>
<body>
    <!-- --- CAMBIO AQUÍ: Envolvemos todo en el .wrapper --- -->
    <div class="wrapper">
        <div class="game-container">
            <img id="main-image" src="" alt="Imagen de la palabra a deletrear" width="200" height="200" onerror="this.style.visibility='hidden'">
            <div class="slots" id="slots"></div>
            <div class="letters" id="letters"></div>
        </div>
        <!-- Enlace para volver al menú, ubicado abajo -->
        <a href="index.html" class="home-link">Volver al menú</a>
        <p class="credit">Iconos: <a href="https://icons8.com" target="_blank" rel="noopener">Icons8</a></p>
    </div>

    <script>
        // El JavaScript no necesita cambios
        const words = [
            { word: "CAT", image: "img/vocab/cat.png" },{ word: "DOG", image: "img/vocab/dog.png" },{ word: "PIG", image: "img/vocab/pig.png" },{ word: "BEE", image: "img/vocab/bee.png" },{ word: "LION", image: "img/vocab/lion.png" },{ word: "FISH", image: "img/vocab/fish.png" },{ word: "BIRD", image: "img/vocab/bird.png" },{ word: "FROG", image: "img/vocab/frog.png" },{ word: "COW", image: "img/vocab/cow.png" },{ word: "FOX", image: "img/vocab/fox.png" },{ word: "BEAR", image: "img/vocab/bear.png" },{ word: "DUCK", image: "img/vocab/duck.png" },{ word: "EGG", image: "img/vocab/egg.png" },{ word: "CAKE", image: "img/vocab/cake.png" },{ word: "APPLE", image: "img/vocab/apple.png" },{ word: "BREAD", image: "img/vocab/bread.png" },{ word: "MILK", image: "img/vocab/milk-bottle.png" },{ word: "CHEESE", image: "img/vocab/cheese.png" },{ word: "ORANGE", image: "img/vocab/orange.png" },{ word: "LEMON", image: "img/vocab/lemon.svg" },{ word: "GRAPE", image: "img/vocab/grapes.png" },{ word: "PEAR", image: "img/vocab/pear.png" },{ word: "SUN", image: "img/vocab/sun.png" },{ word: "MOON", image: "img/vocab/moon.svg" },{ word: "STAR", image: "img/vocab/star.png" },{ word: "TREE", image: "img/vocab/tree.svg" },{ word: "FLOWER", image: "img/vocab/flower.png" },{ word: "CLOUD", image: "img/vocab/cloud.png" },{ word: "WATER", image: "img/vocab/water.png" },{ word: "FIRE", image: "img/vocab/fire.svg" },{ word: "BALL", image: "img/vocab/football2.png" },{ word: "CAR", image: "img/vocab/car.png" },{ word: "HOUSE", image: "img/vocab/home.png" },{ word: "BOOK", image: "img/vocab/book.png" },{ word: "KEY", image: "img/vocab/key.png" },{ word: "DOOR", image: "img/vocab/door.png" },{ word: "BED", image: "img/vocab/bed.png" },{ word: "CHAIR", image: "img/vocab/chair.svg" },{ word: "TABLE", image: "img/vocab/table.png" },{ word: "CLOCK", image: "img/vocab/clock.png" },{ word: "GIFT", image: "img/vocab/gift.png" },{ word: "BOAT", image: "img/vocab/boat.svg" },{ word: "RED", image: "img/vocab/paint-palette.png" },{ word: "BLUE", image: "img/vocab/paint-palette.png" },{ word: "GREEN", image: "img/vocab/paint-palette.png" },{ word: "BOX", image: "img/vocab/box.png" },{ word: "EYE", image: "img/vocab/eye.svg" },{ word: "HAND", image: "img/vocab/hand.svg" },{ word: "FOOT", image: "img/vocab/foot.svg" }
        ];
        let currentWord;
        const imageEl = document.getElementById('main-image' );
        const slotsEl = document.getElementById('slots');
        const lettersEl = document.getElementById('letters');

        function setupRound() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            imageEl.style.visibility = 'visible';
            imageEl.src = currentWord.image;
            slotsEl.innerHTML = '';
            lettersEl.innerHTML = '';
            const shuffledLetters = currentWord.word.split('').sort(() => Math.random() - 0.5);
            currentWord.word.split('').forEach(() => {
                const slot = document.createElement('div');
                slot.classList.add('slot');
                slot.onclick = (e) => moveLetterBack(e.target);
                slotsEl.appendChild(slot);
            });
            shuffledLetters.forEach(char => {
                const letter = document.createElement('div');
                letter.textContent = char;
                letter.classList.add('letter');
                letter.onclick = (e) => moveLetterToSlot(e.target);
                lettersEl.appendChild(letter);
            });
        }

        function moveLetterToSlot(letterElement) {
            const firstEmptySlot = Array.from(slotsEl.children).find(slot => !slot.textContent);
            if (firstEmptySlot) {
                firstEmptySlot.textContent = letterElement.textContent;
                letterElement.style.visibility = 'hidden';
                checkWord();
            }
        }

        function moveLetterBack(slotElement) {
            const letterToMoveBack = slotElement.textContent;
            if (!letterToMoveBack) return;
            const hiddenLetter = Array.from(lettersEl.children).find(l => l.textContent === letterToMoveBack && l.style.visibility === 'hidden');
            if (hiddenLetter) {
                hiddenLetter.style.visibility = 'visible';
            }
            slotElement.textContent = '';
        }

        function checkWord() {
            const filledSlots = Array.from(slotsEl.children).filter(slot => slot.textContent);
            if (filledSlots.length === currentWord.word.length) {
                const formedWord = filledSlots.map(slot => slot.textContent).join('');
                if (formedWord === currentWord.word) {
                    slotsEl.classList.add('correct-animation');
                    setTimeout(() => {
                        slotsEl.classList.remove('correct-animation');
                        setupRound();
                    }, 2000);
                } else {
                    setTimeout(() => {
                        Array.from(slotsEl.children).forEach(moveLetterBack);
                    }, 800);
                }
            }
        }
        setupRound();
    </script>
</body>
</html>
