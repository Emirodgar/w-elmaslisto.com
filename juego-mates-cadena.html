<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mates en Cadena: Juego de Cálculo Mental Gratis | El Más Listo</title>
    <meta name="description" content="Resuelve sumas y restas en cadena contrarreloj y entrena tu agilidad mental. Juego online gratuito, sin descargas.">
    <link rel="canonical" href="https://elmaslisto.com/juego-mates-cadena">
    <meta property="og:title" content="Mates en Cadena: Juego de Cálculo Mental Gratis">
    <meta property="og:description" content="Resuelve sumas y restas en cadena contrarreloj y entrena tu agilidad mental. Juego online gratuito, sin descargas.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://elmaslisto.com/juego-mates-cadena">
	<link rel="icon" href="img/favicon.png">
    
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* El padding: 15px del body ya crea el espacio lateral que necesitas */
        body { background-color: #e74c3c; }
        
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            /* --- CAMBIO CLAVE AQUÍ: Movemos el max-width al wrapper --- */
            max-width: 600px; 
        }

        /* --- CAMBIO CLAVE AQUÍ: El contenedor ahora solo ocupa el 100% de su padre (el wrapper) --- */
        .contenedor{width:100%;background:white;padding:20px;border-radius:15px;box-shadow:0 6px 12px rgba(0,0,0,.15);text-align:center;box-sizing:border-box;}

        .header-juego{display:flex;justify-content:space-between;font-size:1.1em;color:#555;margin-bottom:20px;font-weight:700}#operacion{font-size:2.5em;font-weight:700;min-height:80px;display:flex;align-items:center;justify-content:center;margin:20px 0;color:#2c3e50}.respuestas{display:grid;grid-template-columns:1fr 1fr;gap:10px}.boton-respuesta{padding:15px;font-size:1.5em;border:2px solid #3498db;background-color:#fff;color:#3498db;border-radius:10px;cursor:pointer;transition:background-color .2s,color .2s,transform .1s}.boton-respuesta:hover{background-color:#3498db;color:#fff;transform:translateY(-2px)}.boton-respuesta:active{transform:translateY(1px)}#fin-juego h1{font-size:2em;color:#c0392b}.puntuacion-grande{font-size:4em;font-weight:700;color:#2ecc71;margin:20px 0}#reiniciar{padding:15px 25px;font-size:1.1em;background-color:#2ecc71;color:white;border:none;border-radius:8px;cursor:pointer}.oculto{display:none}@media (min-width:768px){.contenedor{padding:30px}.header-juego{font-size:1.3em}#operacion{font-size:3.5em}#fin-juego h1{font-size:2.5em}.puntuacion-grande{font-size:4.5em}}
		
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Pantalla de juego principal -->
        <div id="juego-activo" class="contenedor">
            <div class="header-juego">
                <p>Puntuación: <span id="puntuacion" aria-live="polite">0</span></p>
                <p>Tiempo: <span id="tiempo">10</span>s</p>
            </div>
            <div id="operacion"></div>
            <div class="respuestas">
                <button id="respuesta1" class="boton-respuesta"></button>
                <button id="respuesta2" class="boton-respuesta"></button>
            </div>
        </div>

        <!-- Pantalla de fin de juego (inicialmente oculta) -->
        <div id="fin-juego" class="contenedor oculto">
            <h1>¡Fin del juego!</h1>
            <p>Tu puntuación final es:</p>
            <p id="puntuacion-final" class="puntuacion-grande">0</p>
            <button id="reiniciar">Volver a jugar</button>
        </div>

        <a href="index.html" class="home-link">Volver al menú</a>
    </div>

    <script src="quiz-engine.js"></script>
    <script>
        const operacionEl = document.getElementById('operacion');
        const respuesta1Btn = document.getElementById('respuesta1');
        const respuesta2Btn = document.getElementById('respuesta2');
        let respuestaCorrecta, numeroActual;

        function generarOperacion() {
            const num2 = Math.floor(Math.random() * 10) + 1;
            const esSuma = Math.random() > 0.5;
            if (esSuma) {
                respuestaCorrecta = numeroActual + num2;
                operacionEl.textContent = `${numeroActual} + ${num2}`;
            } else {
                if (num2 > numeroActual) {
                    respuestaCorrecta = num2 - numeroActual;
                    operacionEl.textContent = `${num2} - ${numeroActual}`;
                } else {
                    respuestaCorrecta = numeroActual - num2;
                    operacionEl.textContent = `${numeroActual} - ${num2}`;
                }
            }
        }
        
        function generarRespuestas() {
            let respuestaIncorrecta;
            do {
                const desviacion = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                respuestaIncorrecta = respuestaCorrecta + desviacion;
            } while (respuestaIncorrecta === respuestaCorrecta || respuestaIncorrecta < 0);
            if (Math.random() > 0.5) {
                respuesta1Btn.textContent = respuestaCorrecta;
                respuesta2Btn.textContent = respuestaIncorrecta;
            } else {
                respuesta1Btn.textContent = respuestaIncorrecta;
                respuesta2Btn.textContent = respuestaCorrecta;
            }
        }

        const quiz = crearQuizContrarreloj({
            tiempoInicial: 10,
            alIniciar() {
                const num1 = Math.floor(Math.random() * 10) + 1;
                const num2 = Math.floor(Math.random() * 10) + 1;
                numeroActual = num1 + num2;
                operacionEl.textContent = `${num1} + ${num2}`;
                respuestaCorrecta = numeroActual;
                generarRespuestas();
            },
            generarRonda() {
                generarOperacion();
                generarRespuestas();
            },
            comprobarRespuesta(texto) {
                const correcta = parseInt(texto) === respuestaCorrecta;
                if (correcta) numeroActual = respuestaCorrecta;
                return correcta;
            },
        });
        quiz.iniciar();
    </script>
</body>
</html>
